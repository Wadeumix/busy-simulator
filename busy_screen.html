<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>System Process</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#c9d1d9;
    --accent:#58a6ff; --green:#3fb950; --dim:#8b949e;
  }
  *{box-sizing:border-box; cursor:wait;}
  html,body{ height:100%; }
  body{
    margin:0; background:var(--panel); color:var(--text);
    font-family:"SF Mono","Consolas","Menlo",monospace;
    display:flex; flex-direction:column;
    cursor:wait;
  }
  .topbar{
    background:#21262d; padding:10px 14px; display:flex; align-items:center; gap:8px;
    border-bottom:1px solid var(--border); font-size:13px; color:var(--dim);
    -webkit-app-region:drag;
  }
  .body{
    padding:20px 22px; font-size:13.5px; line-height:1.65;
    flex:1; min-height:0; display:flex; flex-direction:column;
  }
  .log-area{ flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
  .log-line{ opacity:0; animation:fadeIn .25s forwards; white-space:pre-wrap; }
  .ok{color:var(--green);}
  .tag{color:var(--accent);}
  .dimmed{color:var(--dim);}
  @keyframes fadeIn{ to{opacity:1;} }
  .progress-wrap{ margin-top:16px; flex-shrink:0; }
  .bar-outer{
    width:100%; height:8px; background:#010409; border-radius:4px; overflow:hidden;
    border:1px solid var(--border);
  }
  .bar-inner{
    height:100%; width:0%; background:linear-gradient(90deg,#1f6feb,#58a6ff);
    transition:width .4s ease;
  }
  .status-row{
    display:flex; justify-content:space-between; margin-top:8px;
    font-size:12px; color:var(--dim);
  }
  .cursor{ display:inline-block; width:8px; height:14px; background:var(--accent);
    animation:blink 1s step-end infinite; vertical-align:text-bottom; margin-left:2px;}
  @keyframes blink{ 50%{opacity:0;} }
  .clock{ font-size:12px; color:var(--dim); }

  /* ---- 20秒レア演出 ---- */
  body.critical{ animation:critical-flash 1s ease-in-out infinite; }
  @keyframes critical-flash{
    0%, 100%{ box-shadow:inset 0 0 0 0 rgba(248,81,73,0); }
    50%{ box-shadow:inset 0 0 60px 6px rgba(248,81,73,.55); }
  }
  body.critical .topbar{ background:#3a1414; border-bottom-color:#f85149; }
  body.critical .bar-inner{
    background:linear-gradient(90deg,#f85149,#ff7b72) !important;
  }
  .critical-line{
    color:#f85149 !important; font-weight:bold;
    animation:critical-text-flash .5s ease-in-out infinite;
  }
  @keyframes critical-text-flash{ 50%{ opacity:.4; } }
  :root{ --fx-shake:1; }
  body.critical .log-area{ animation:critical-shake .25s linear infinite; }
  @keyframes critical-shake{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(calc(var(--fx-shake) * -1px),calc(var(--fx-shake) * 1px)); }
    40%{ transform:translate(calc(var(--fx-shake) * 1px),calc(var(--fx-shake) * -1px)); }
    60%{ transform:translate(calc(var(--fx-shake) * -1px),calc(var(--fx-shake) * -1px)); }
    80%{ transform:translate(calc(var(--fx-shake) * 1px),calc(var(--fx-shake) * 1px)); }
    100%{ transform:translate(0,0); }
  }

  /* ---- "T"キーで呼び出すコマンド入力欄(普段は非表示) ---- */
  #cmdInput{
    background:transparent; border:none; outline:none; padding:0;
    font-family:inherit; font-size:12px; color:var(--dim);
    width:0; opacity:0; caret-color:var(--dim);
    transition:width .15s ease, opacity .15s ease;
  }
  #cmdInput.active{ width:220px; opacity:1; cursor:text; }

  /* ---- 10ログ消化ごとのボーナス抽選ポップアップ ---- */
  /* 見た目は他のダイアログと同じく地味な"システム通知"トーンに揃える */
  #bonusOverlay{
    position:fixed; inset:0; background:rgba(1,4,9,.45);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:100;
    font-family:"SF Mono","Consolas","Menlo",monospace;
  }
  #bonusOverlay.show{ opacity:1; pointer-events:auto; }
  #bonusBox{
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:14px 18px; min-width:240px; text-align:left;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #bonusBox .bonus-title{
    font-size:11px; color:var(--dim); letter-spacing:.03em;
    border-bottom:1px solid var(--border); padding-bottom:6px; margin-bottom:8px;
  }
  #bonusBox .bonus-result{ font-size:13px; color:var(--text); margin:0 0 3px; }
  #bonusBox .bonus-result::before{ content:"✓ "; color:var(--green); }
  #bonusBox .bonus-sub{ font-size:12px; color:var(--dim); }

  /* ---- 黄色いログ(ルーレット発生トリガー) ---- */
  .roulette-line{ color:#facc15 !important; font-weight:bold; }

  /* ---- スキン(見た目)プリセット ---- */
  body.skin-neon .bar-inner{ background:linear-gradient(90deg,#d63bff,#39ffe0) !important; }
  body.skin-neon{ font-family:"Courier New",monospace; }
  body.skin-amber .bar-inner{ background:linear-gradient(90deg,#b45309,#fbbf24) !important; }
  body.skin-amber{ font-family:Georgia,"Times New Roman",serif; }
</style>
</head>
<body>
  <div class="topbar">
    <span>build-pipeline — production</span>
    <span style="margin-left:auto" class="clock" id="clock"></span>
  </div>
  <div class="body">
    <div class="log-area"><div id="log"></div></div>
    <div class="progress-wrap">
      <div class="bar-outer"><div class="bar-inner" id="bar"></div></div>
      <div class="status-row">
        <span id="pct">0%</span>
        <span id="statusText">initializing…</span>
        <span id="durText" class="dimmed"></span>
        <span id="queueText" class="dimmed"></span>
        <span id="coinText" class="dimmed"></span>
        <input id="cmdInput" type="text" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <div id="bonusOverlay">
    <div id="bonusBox">
      <div class="bonus-title">config sync — patch candidate applied</div>
      <div class="bonus-result" id="bonusResult"></div>
      <div class="bonus-sub" id="bonusSub"></div>
    </div>
  </div>

<script>
const logEl = document.getElementById("log");
const bar = document.getElementById("bar");
const pct = document.getElementById("pct");
const statusText = document.getElementById("statusText");
const durText = document.getElementById("durText");
const queueText = document.getElementById("queueText");
const coinText = document.getElementById("coinText");
const cmdInput = document.getElementById("cmdInput");
const clock = document.getElementById("clock");
const bonusOverlay = document.getElementById("bonusOverlay");
const bonusResult = document.getElementById("bonusResult");
const bonusSub = document.getElementById("bonusSub");
function updateClock(){
  clock.textContent = new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// ---- ランダムログ生成用の部品 ----
const modules = ["auth","billing","catalog","search-index","user-profile","notification",
  "media-pipeline","recommendation","cache-layer","analytics","payments","inventory",
  "session-store","image-cdn","report-engine","queue-worker","ml-scoring","geo-service"];
const hosts = ["prod-worker-01","prod-worker-04","prod-worker-07","staging-node-02",
  "cache-node-03","db-replica-05","worker-pool-a","worker-pool-b"];
const actions = [
  m => `scanning module ${m} for stale references`,
  m => `rebuilding index for ${m}`,
  m => `validating schema on ${m}`,
  m => `compiling ${m} bundle`,
  m => `running unit tests for ${m}`,
  m => `syncing ${m} state with remote store`,
  m => `applying migration to ${m}`,
  m => `warming cache for ${m}`,
  m => `resolving dependency graph for ${m}`,
  m => `optimizing queries in ${m}`,
  m => `checking integrity of ${m} records`,
  m => `pruning dead entries from ${m}`,
  m => `re-encoding assets for ${m}`,
  m => `analyzing ${m} performance metrics`,
  m => `deploying patch to ${m}`,
];
function hexId(len){
  const chars = "0123456789abcdef";
  let s = "";
  for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function randInt(a,b){ return Math.floor(a + Math.random()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function generateLogEvent(){
  const m = pick(modules);
  const actionText = pick(actions)(m);
  const roll = Math.random();
  if(roll < 0.68){
    return {prefix:"> ", text:`${actionText} [${hexId(6)}]`, cls:"dimmed"};
  } else if(roll < 0.93){
    const n = randInt(3, 480);
    return {prefix:"✓ ", text:`${actionText} — done (${n} records, host: ${pick(hosts)})`, cls:"ok"};
  } else {
    return {prefix:"i ", text:`retrying ${m} — transient timeout, attempt ${randInt(1,3)}`, cls:"dimmed"};
  }
}

// ---- 全体の完了時刻: 約2時間後 ----
const TOTAL_DURATION_MS = 2 * 60 * 60 * 1000;
const startTime = performance.now();

// 各ログ行の表示時間(秒) — 二段階抽選
// 第1段階: 「1〜4秒」というひとまとまりの候補 vs 5秒,6秒,...,20秒 という個別の候補、から1つを選ぶ
//   → 「1〜4秒」の枠自体が60%、10秒以降は各1%以下、15秒=0.1%以下、20秒=0.01%以下
// 第2段階: 第1段階で「1〜4秒」が当たった場合のみ、その中から1・2・3・4秒を均等抽選
const BUCKETS = [
  { seconds: null, weight: 60.0 },   // "1〜4秒" のまとまり
  { seconds: 5,  weight: 10.50 },
  { seconds: 6,  weight: 8.70 },
  { seconds: 7,  weight: 7.00 },
  { seconds: 8,  weight: 5.60 },
  { seconds: 9,  weight: 4.52 },
  { seconds: 10, weight: 1.00 },
  { seconds: 11, weight: 0.90 },
  { seconds: 12, weight: 0.70 },
  { seconds: 13, weight: 0.50 },
  { seconds: 14, weight: 0.30 },
  { seconds: 15, weight: 0.10 },
  { seconds: 16, weight: 0.07 },
  { seconds: 17, weight: 0.05 },
  { seconds: 18, weight: 0.03 },
  { seconds: 19, weight: 0.02 },
  { seconds: 20, weight: 0.01 },
];
const BASE_BUCKET_WEIGHTS = BUCKETS.map(b => b.weight);

// オッズアップグレードで購入した分だけ、レア枠(10秒以降)の重みを底上げする
// (見た目の処理時間の分布も一緒に変わる仕様は意図した挙動)
function applyOddsLevel(level){
  BUCKETS.forEach((b, i) => {
    if(b.seconds !== null && b.seconds >= 10){
      // レベルごとにレア枠の重みを+15%ずつ強化(最大10レベルまで)
      const boost = 1 + Math.min(level, 10) * 0.15;
      b.weight = BASE_BUCKET_WEIGHTS[i] * boost;
    }
  });
}

function pickBucket(){
  const total = BUCKETS.reduce((a, b) => a + b.weight, 0);
  let r = Math.random() * total;
  let chosen = BUCKETS[BUCKETS.length - 1];
  for(const b of BUCKETS){
    r -= b.weight;
    if(r <= 0){ chosen = b; break; }
  }
  // 「1〜4秒」の枠が当たった場合は、その中でさらに均等抽選
  return chosen.seconds !== null ? chosen.seconds : randInt(1, 4);
}

// ---- 秒数(レア度) → コイン報酬 の対応テーブル ----
const REWARD_TABLE = {
  1:1, 2:1, 3:1, 4:1,
  5:2, 6:3, 7:4, 8:5, 9:6,
  10:10, 11:16, 12:24, 13:35, 14:50,
  15:200, 16:340, 17:480, 18:620, 19:800,
  20:5000,
};

function appendLogLine(){
  const ev = generateLogEvent();
  const div = document.createElement("div");
  div.className = "log-line";
  div.innerHTML = `<span class="${ev.cls}">${ev.prefix}</span>${ev.text}`;
  logEl.appendChild(div);

  // ログが際限なく積み上がらないよう、一定数を超えたら古い行を削除
  while(logEl.children.length > 200){
    logEl.removeChild(logEl.firstChild);
  }
}

function animateBar(duration){
  durText.textContent = `(${(duration/1000).toFixed(duration % 1000 === 0 ? 0 : 1)}s)`;
  pct.textContent = "0%";
  bar.style.transition = "none";
  bar.style.width = "0%";
  // reflow を挟んでからトランジションを有効化
  void bar.offsetWidth;
  bar.style.transition = `width ${duration}ms linear`;
  bar.style.width = "100%";

  const pctStart = performance.now();
  const pctTimer = setInterval(() => {
    const p = Math.min(100, Math.round(((performance.now() - pctStart) / duration) * 100));
    pct.textContent = p + "%";
    if(p >= 100) clearInterval(pctTimer);
  }, 50);
}

// ---- 20秒(0.01%)を引いた時だけの特別演出 ----
function triggerCriticalEvent(duration){
  const div = document.createElement("div");
  div.className = "log-line critical-line";
  div.textContent = "⚠ anomaly detected — deep scan in progress, do not close window";
  logEl.appendChild(div);

  document.body.style.setProperty("--fx-shake", String(1 + state.fxLevel * 0.6));
  document.body.classList.add("critical");
  statusText.textContent = "ANOMALY DETECTED";
  animateBar(duration);

  // ログ50件のラッシュにrouletteNの倍率を乗せる(既存のバフは上書きされる)
  state.activeBuff = { remaining: 50, multiplier: state.rouletteN };
  saveState();
  injectBarrage(50);

  // 高速ルーレットを10回分キューに追加(次に消化される10回は通常より短い時間で回る)
  state.roulettePending += 10;
  state.fastSpinsRemaining += 10;
  saveState();
  renderQueue();
  showRouletteWaiting();
  if(!isProcessing) tick();

  setTimeout(() => {
    document.body.classList.remove("critical");
  }, duration);
}

// =====================================================================
// ---- 隠しコインプッシャー要素 ----
// 見た目は通常のログ/ステータス画面のまま、裏側でアイドルゲームの状態を管理する
// =====================================================================
const STATE_KEY = "busySimState";
const DEFAULT_STATE = {
  coins: 0, incomeLevel: 0, oddsLevel: 0, skinId: "default", fxLevel: 0,
  pendingPulls: 0, priorityPulls: 0, resolvedSincePopup: 0, activeBuff: null,
  roulettePending: 0, rouletteN: 2, fastSpinsRemaining: 0,
};

function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if(!raw) return { ...DEFAULT_STATE };
    return { ...DEFAULT_STATE, ...JSON.parse(raw) };
  } catch(e){
    return { ...DEFAULT_STATE };
  }
}
function saveState(){
  try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e){}
}

const state = loadState();
applyOddsLevel(state.oddsLevel);
applySkin(state.skinId);

function formatCoins(n){
  const units = [
    { value: 1e12, suffix: "T" },
    { value: 1e9,  suffix: "B" },
    { value: 1e6,  suffix: "M" },
    { value: 1e3,  suffix: "K" },
  ];
  for(const u of units){
    if(n >= u.value){
      const v = n / u.value;
      // 小数点以下は10未満の時だけ1桁表示(例: 1.2K)、それ以外は整数(例: 42K)
      const formatted = v < 10 ? v.toFixed(1).replace(/\.0$/, "") : Math.floor(v).toString();
      return formatted + u.suffix;
    }
  }
  return String(n);
}

function renderCoins(){
  coinText.textContent = `rev.${formatCoins(state.coins)}`;
}
renderCoins();
renderQueue();

function addCoins(n){
  state.coins += n;
  renderCoins();
  saveState();
}

function applySkin(skinId){
  document.body.classList.remove("skin-neon", "skin-amber");
  if(skinId === "neon") document.body.classList.add("skin-neon");
  if(skinId === "amber") document.body.classList.add("skin-amber");
}

// ---- 放置による自動収入 ----
const BASE_INCOME_INTERVAL_MS = 10000;
function passiveIncomeTick(){
  const interval = Math.max(2000, BASE_INCOME_INTERVAL_MS * Math.pow(0.9, state.incomeLevel));
  addCoins(1);
  setTimeout(passiveIncomeTick, interval);
}
setTimeout(passiveIncomeTick, BASE_INCOME_INTERVAL_MS);

// ---- クリックによる「処理待ちログ」の積み上げ ----
// クリックはその場で抽選しない。キューに積むだけで、実際の抽選(コイン化)は
// 通常のtick()が回ってきた時に、そのtickの結果を使って初めて行われる
// (state.pendingPulls / state.priorityPulls / state.resolvedSincePopup / state.activeBuff は
//  localStorageに永続化され、ウィンドウを閉じても引き継がれる)
const PRIORITY_PULL_MS = 500;
const FAST_RUSH_MS = 100; // 500件マイルストーン到達直後の高速消化間隔
const PRIORITY_PULL_REWARD = 1;

function renderQueue(){
  const total = state.pendingPulls + state.priorityPulls + state.roulettePending;
  queueText.textContent = total > 0
    ? `queue:${formatCoins(total)}${state.priorityPulls > 0 ? ` (rush:${formatCoins(state.priorityPulls)})` : ""}`
    : "";
  saveState();
}

// ラッシュ(priorityPulls)が500件溜まるたびに、30回分の10消費ボーナスと
// 高速ルーレット20回分をその場で一気に発生させる
function triggerRushMilestone(){
  const div = document.createElement("div");
  div.className = "log-line roulette-line";
  div.textContent = "◆ backlog threshold reached — running batch verification";
  logEl.appendChild(div);

  // 高速ルーレットも20回分キューに追加(通常のラッシュ消化と並行して積む)
  state.roulettePending += 20;
  state.fastSpinsRemaining += 20;
  saveState();
  renderQueue();
  showRouletteWaiting();
}

const RUSH_MILESTONE_STEP = 500;

function injectBarrage(n){
  // 累積カウンターではなく、現在のラッシュ在庫(スタック数)自体が
  // 500の倍数をいくつ跨いだかで判定する(途中からの再開でも正しく動く)
  const before = Math.floor(state.priorityPulls / RUSH_MILESTONE_STEP);
  state.priorityPulls += n;
  const after = Math.floor(state.priorityPulls / RUSH_MILESTONE_STEP);
  for(let i = 0; i < after - before; i++) triggerRushMilestone();

  renderQueue();
  if(!isProcessing) tick();
}

// クリック10回で処理待ちキュー1件分になる
let clickTally = 0;
const CLICKS_PER_PULL = 10;

document.addEventListener("click", (e) => {
  if(e.target === cmdInput) return;
  clickTally++;
  if(clickTally < CLICKS_PER_PULL) return;
  clickTally = 0;

  const wasIdle = (state.pendingPulls + state.priorityPulls + state.roulettePending) <= 0 && !isProcessing;
  state.pendingPulls++;
  renderQueue();
  if(wasIdle) tick();
});

// ---- 10ログ消化ごとのボーナス抽選 ----
// 上から下へ確率が減っていく。ハズレが最も高確率、×20 JACKPOTが最も低確率
// ジャックポット(バラージ)は0.5秒ラッシュ中でも重ねて適用される(倍率バフも乗る)
const BONUS_TABLE = [
  { weight: 40, label: "nothing",                    sub: "特に変化なし",                    apply: () => {} },
  { weight: 25, label: "backlog +5 items",           sub: "ログキューが5件増加",              apply: () => { state.pendingPulls += 5;  renderQueue(); } },
  { weight: 15, label: "backlog +10 items",          sub: "ログキューが10件増加",             apply: () => { state.pendingPulls += 10; renderQueue(); } },
  { weight: 8,  label: "backlog +20 items",          sub: "ログキューが20件増加",             apply: () => { state.pendingPulls += 20; renderQueue(); } },
  { weight: 6,  label: "throughput ×2 (short)",      sub: "次の5ログ分の獲得revが2倍",         apply: () => { state.activeBuff = { remaining: 5,  multiplier: 2 }; saveState(); } },
  { weight: 3,  label: "throughput ×2 (extended)",   sub: "次の20ログ分の獲得revが2倍",        apply: () => { state.activeBuff = { remaining: 20, multiplier: 2 }; saveState(); } },
  // ルーレットは専用キュー(roulettePending)に積む。ラッシュ終了後、通常キューより先に消化される
  { weight: 2,  label: "manual review required",     sub: "ルーレットが1件キューに追加",       apply: () => { state.roulettePending += 1; renderQueue(); showRouletteWaiting(); } },
  { weight: 1,  label: "critical patch escalation",  sub: "次の20ログ分の獲得revが20倍 + 無償ログ100件が割り込み", apply: () => { state.activeBuff = { remaining: 20, multiplier: 20 }; saveState(); injectBarrage(100); } },
];
const BONUS_TOTAL_WEIGHT = BONUS_TABLE.reduce((a, b) => a + b.weight, 0);
let bonusHideTimer = null;

function pickBonus(){
  let r = Math.random() * BONUS_TOTAL_WEIGHT;
  for(const b of BONUS_TABLE){
    r -= b.weight;
    if(r <= 0) return b;
  }
  return BONUS_TABLE[BONUS_TABLE.length - 1];
}

function showBonusPopup(){
  const bonus = pickBonus();
  bonus.apply();
  bonusResult.textContent = bonus.label;
  bonusSub.textContent = bonus.sub;
  bonusOverlay.classList.add("show");
  if(bonusHideTimer) clearTimeout(bonusHideTimer);
  bonusHideTimer = setTimeout(() => {
    bonusOverlay.classList.remove("show");
  }, 2600);
}

// =====================================================================
// ---- ルーレット(独立した別ウィンドウで開く) ----
// 青が最も多くコマを占め、赤は全体の中でただ1コマだけ(スーパージャックポット)
// =====================================================================
// 各色の配分は割合(%)で管理し、合計が最大100%になるようにする
// (青50% / 黄25% / 緑10% / オレンジ10% / 赤5% = 100%)
// 見た目のコマ数は確率の分解能とは分けて、視認性の良い20コマ分で表示する
const ROULETTE_PERCENTS = { blue: 50, yellow: 25, green: 10, orange: 10, red: 5 };
const ROULETTE_TILE_COUNT = 20;
const ROULETTE_WHEEL = Object.entries(ROULETTE_PERCENTS)
  .flatMap(([color, pct]) => Array(Math.round(pct / 100 * ROULETTE_TILE_COUNT)).fill(color));
const ROULETTE_COLORS = {
  blue:   { label: "queue +50",        sub: () => "通常キューが50件増加" },
  yellow: { label: "rush +100",        sub: () => "ラッシュキューが100件増加" },
  green:  { label: "rev bonus",        sub: () => `${state.rouletteN}万revを獲得` },
  orange: { label: "multiplier up",    sub: () => `倍率係数(N)が永久に×5 → 次はN=${state.rouletteN * 5}` },
  red:    { label: "SUPER JACKPOT",    sub: () => `5000件のラッシュログが${state.rouletteN}倍で発生` },
};
function applyRouletteColor(color){
  if(color === "blue"){
    state.pendingPulls += 50;
    renderQueue();
  } else if(color === "yellow"){
    injectBarrage(100); // 500件マイルストーン判定を通すため、直接加算せずinjectBarrage経由にする
  } else if(color === "green"){
    addCoins(state.rouletteN * 10000);
  } else if(color === "orange"){
    state.rouletteN *= 5;
    saveState();
  } else if(color === "red"){
    state.activeBuff = { remaining: 5000, multiplier: state.rouletteN };
    saveState();
    injectBarrage(5000);
  }
  // ルーレットが決着した時点でメインのtickループが止まっていれば起こす
  // (isProcessingが真の間は何もしない = 既存のループと衝突させない)
  if(!isProcessing) tick();
}

let rouletteWin = null;
let rouletteActive = false; // trueの間はtick()が新しいルーレットセッションを開始しない

function shuffled(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rouletteWindowClosedOrMissing(){
  return !rouletteWin || rouletteWin.closed;
}

function buildRouletteWindow(){
  const w = 360, h = 300;
  const left = Math.round((screen.width - w) / 2);
  const top = Math.round((screen.height - h) / 2);
  const win = window.open("about:blank", "rouletteWin",
    `width=${w},height=${h},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no,resizable=no`);
  if(!win) return null;

  win.document.title = "System Process";
  win.document.head.innerHTML = `<style>
    *{box-sizing:border-box;}
    body{
      margin:0; height:100vh; display:flex; flex-direction:column;
      background:#161b22; color:#c9d1d9; font-family:"SF Mono","Consolas","Menlo",monospace;
      cursor:wait;
    }
    .topbar{
      background:#21262d; padding:10px 14px; display:flex; align-items:center; gap:8px;
      border-bottom:1px solid #30363d; font-size:13px; color:#8b949e; flex-shrink:0;
    }
    .body{ padding:18px 20px; flex:1; display:flex; flex-direction:column; }
    .subline{ font-size:12px; color:#8b949e; margin-bottom:6px; }
    .stack{ font-size:11px; color:#8b949e; margin-bottom:10px; min-height:14px; }
    .viewport{
      overflow:hidden; width:100%; height:8px;
      border:1px solid #30363d; border-radius:4px; background:#010409;
    }
    .strip{ display:flex; gap:1px; height:100%; }
    .tile{
      flex:1 1 0; height:100%; border-radius:0;
      opacity:.35; transition:opacity .12s ease;
    }
    .tile.active{ opacity:1; }
    .t-blue{ background:#58a6ff; }
    .t-yellow{ background:#c9a227; }
    .t-green{ background:#3fb950; }
    .t-orange{ background:#c9822f; }
    .t-red{ background:#f85149; }
    .result-box{
      margin-top:16px; background:#161b22; border:1px solid #30363d; border-radius:6px;
      padding:14px 18px; opacity:0; transition:opacity .2s ease;
    }
    .result-box.show{ opacity:1; }
    .result-box .box-title{
      font-size:11px; color:#8b949e; letter-spacing:.03em;
      border-bottom:1px solid #30363d; padding-bottom:6px; margin-bottom:8px;
    }
    .result-box .result{ font-size:13px; color:#c9d1d9; margin:0 0 3px; }
    .result-box .result::before{ content:"✓ "; color:#3fb950; }
    .result-box .sub{ font-size:12px; color:#8b949e; }
  </style>`;
  win.document.body.innerHTML = `
    <div class="topbar">build-pipeline — verification</div>
    <div class="body">
      <div class="subline" id="counter">resolving candidate patch…</div>
      <div class="stack" id="stack"></div>
      <div class="viewport" id="viewport">
        <div class="strip" id="strip"></div>
      </div>
      <div class="result-box" id="resultBox">
        <div class="box-title">config sync — patch candidate applied</div>
        <div class="result" id="result"></div>
        <div class="sub" id="sub"></div>
      </div>
    </div>
  `;
  return win;
}

function ensureRouletteWindow(){
  if(rouletteWindowClosedOrMissing()){
    rouletteWin = buildRouletteWindow();
  }
  return rouletteWin;
}

// ラッシュ処理中などでまだスピンを開始できない間も、ルーレットが積まれた時点で
// 先にウィンドウだけ開いてスタック数と待機中である旨を表示しておく
function showRouletteWaiting(){
  if(state.roulettePending <= 0) return;
  if(rouletteActive) return; // 既にスピン中ならそちらの表示に任せる
  const win = ensureRouletteWindow();
  if(!win) return; // ポップアップがブロックされている場合は何もしない
  const doc = win.document;
  const counterEl = doc.getElementById("counter");
  const stackEl = doc.getElementById("stack");
  const resultBox = doc.getElementById("resultBox");
  if(resultBox) resultBox.classList.remove("show");
  if(counterEl) counterEl.textContent = "queued — waiting for current workload to clear…";
  if(stackEl) stackEl.textContent = `stack: +${state.roulettePending}`;
}

function spinRouletteOnce(win, onDone){
  const doc = win.document;
  const strip = doc.getElementById("strip");
  const resultEl = doc.getElementById("result");
  const subEl = doc.getElementById("sub");
  const counterEl = doc.getElementById("counter");
  const resultBox = doc.getElementById("resultBox");
  resultEl.textContent = "";
  subEl.textContent = "";
  resultBox.classList.remove("show");

  // コマの色を毎回ランダムに並べ替えて固定表示する(スクロールはしない)
  const segments = shuffled(ROULETTE_WHEEL);
  strip.innerHTML = segments.map(c => `<div class="tile t-${c}"></div>`).join("");
  const tiles = Array.from(strip.children);

  // 当選タイルを決定(コマ数の比率がそのまま確率になる)
  const targetIndex = randInt(0, segments.length - 1);
  const winningColor = segments[targetIndex];

  // 異常検知で積まれた「高速ルーレット」の残数があれば、このスピンは短時間で回す
  const isFast = state.fastSpinsRemaining > 0;
  if(isFast){
    state.fastSpinsRemaining--;
    saveState();
  }

  // 左から右へ1コマずつハイライトが移動し、周回しながら当選コマに止まる
  // 全体の所要時間は通常30秒〜2分。高速時は固定10秒
  const TOTAL_SPIN_MS = isFast ? 10000 : randInt(30000, 120000);
  const LOOPS = isFast ? randInt(2, 4) : randInt(12, 20);
  const totalSteps = LOOPS * segments.length + targetIndex + 1;

  // 全区間にわたって減速させる。カーブはsmoothstep(3t²-2t³)を使い、
  // 序盤・終盤がなだらかで中盤の変化が大きいS字型の減速になるようにする
  const weights = [];
  for(let i = 0; i < totalSteps; i++){
    const t = (i + 1) / totalSteps;
    weights.push(t * t * (3 - 2 * t));
  }
  const weightSum = weights.reduce((a, b) => a + b, 0) || 1;
  const delays = weights.map(w => (w / weightSum) * TOTAL_SPIN_MS);

  let step = 0;
  let prevTile = null;

  function advance(){
    if(prevTile) prevTile.classList.remove("active");
    const idx = step % segments.length;
    tiles[idx].classList.add("active");
    prevTile = tiles[idx];
    step++;
    const pct = Math.min(100, Math.round((step / totalSteps) * 100));
    counterEl.textContent = `resolving candidate patch — ${pct}%`;

    if(step >= totalSteps){
      applyRouletteColor(winningColor);
      const info = ROULETTE_COLORS[winningColor];
      resultEl.textContent = info.label;
      subEl.textContent = info.sub();
      resultBox.classList.add("show");
      win.setTimeout(onDone, 1800);
      return;
    }

    win.setTimeout(advance, delays[step]);
  }
  advance();
}

function startRouletteSequence(){
  // ルーレットはメインのtickループとは独立して進行する(呼び出し元で待たない)。
  // 効果適用側(applyRouletteColor)が、メインループが止まっていれば起こす。
  // rouletteActiveが立っている間は、tick()側が新たなセッションを起動しないようにする
  // (このセッション内で溜まった追加分のroulettePendingはrunNext()が1つずつ順番に消化する)
  rouletteActive = true;

  const win = ensureRouletteWindow();
  if(!win){
    // ポップアップがブロックされた場合は、演出なしで抽選だけ実行してキューを消化する
    // (この回の分はtick()側で既にroulettePendingからデクリメント済み)
    applyRouletteColor(pick(ROULETTE_WHEEL));
    while(state.roulettePending > 0){
      state.roulettePending--;
      applyRouletteColor(pick(ROULETTE_WHEEL));
    }
    renderQueue();
    rouletteActive = false;
    return;
  }

  function runNext(){
    if(rouletteWindowClosedOrMissing()){
      // ユーザーが手動でウィンドウを閉じた場合は、残りは抽選だけ即時消化
      while(state.roulettePending > 0){
        state.roulettePending--;
        applyRouletteColor(pick(ROULETTE_WHEEL));
      }
      renderQueue();
      rouletteActive = false;
      return;
    }
    const stackEl = win.document.getElementById("stack");
    if(stackEl){
      stackEl.textContent = state.roulettePending > 0 ? `stack: +${state.roulettePending}` : "";
    }
    spinRouletteOnce(win, () => {
      if(state.roulettePending > 0){
        state.roulettePending--;
        renderQueue();
        runNext();
      } else {
        win.setTimeout(() => {
          if(!rouletteWindowClosedOrMissing()) win.close();
          rouletteWin = null;
          rouletteActive = false;
        }, 600);
      }
    });
  }
  runNext();
}

// ---- アップグレードのコスト計算 ----
function upgradeCost(level){
  return Math.round(20 * Math.pow(1.6, level));
}

// ---- コマンド入力(見た目は地味なテキスト欄) ----
function printSystemLine(text, cls){
  const div = document.createElement("div");
  div.className = "log-line" + (cls ? ` ${cls}` : "");
  div.innerHTML = `<span class="dimmed">i </span>${text}`;
  logEl.appendChild(div);
  while(logEl.children.length > 200){
    logEl.removeChild(logEl.firstChild);
  }
}

function tryBuy(kind, arg){
  if(kind === "income"){
    const cost = upgradeCost(state.incomeLevel);
    if(state.coins < cost){ printSystemLine(`config patch rejected — insufficient quota [${hexId(6)}]`); return; }
    state.coins -= cost;
    state.incomeLevel++;
    saveState();
    printSystemLine(`config patch applied (patch-id: ${hexId(6)}) — throughput tuning updated`, "ok");
  } else if(kind === "odds"){
    const cost = upgradeCost(state.oddsLevel);
    if(state.coins < cost){ printSystemLine(`config patch rejected — insufficient quota [${hexId(6)}]`); return; }
    state.coins -= cost;
    state.oddsLevel++;
    applyOddsLevel(state.oddsLevel);
    saveState();
    printSystemLine(`config patch applied (patch-id: ${hexId(6)}) — scheduler weights rebalanced`, "ok");
  } else if(kind === "fx"){
    const cost = upgradeCost(state.fxLevel);
    if(state.coins < cost){ printSystemLine(`config patch rejected — insufficient quota [${hexId(6)}]`); return; }
    state.coins -= cost;
    state.fxLevel++;
    saveState();
    printSystemLine(`config patch applied (patch-id: ${hexId(6)}) — alert renderer updated`, "ok");
  } else if(kind === "skin"){
    const validSkins = ["default", "neon", "amber"];
    if(!validSkins.includes(arg)){ printSystemLine(`config patch rejected — unknown profile "${arg}"`); return; }
    const cost = 100;
    if(state.coins < cost){ printSystemLine(`config patch rejected — insufficient quota [${hexId(6)}]`); return; }
    state.coins -= cost;
    state.skinId = arg;
    applySkin(arg);
    saveState();
    printSystemLine(`config patch applied (patch-id: ${hexId(6)}) — theme profile switched to "${arg}"`, "ok");
  } else {
    printSystemLine(`unknown directive — no action taken`);
  }
  renderCoins();
}

function handleCommand(raw){
  const parts = raw.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return;
  const [cmd, sub, arg] = parts;

  if(cmd === "buy" && sub){
    tryBuy(sub, arg);
  } else if(cmd === "status"){
    printSystemLine(`config dump — rev.${state.coins}, income.L${state.incomeLevel}, odds.L${state.oddsLevel}, fx.L${state.fxLevel}, theme=${state.skinId}, queue=${state.pendingPulls}, rush=${state.priorityPulls}, roulette=${state.roulettePending}`);
  } else if(cmd === "help"){
    printSystemLine(`available directives: buy income | buy odds | buy fx | buy skin <default|neon|amber> | status | debug roulette [n] | debug jackpot | debug bonus | debug anomaly | reset confirm`);
  } else if(cmd === "debug" && sub === "roulette"){
    const n = Math.max(1, parseInt(arg, 10) || 1);
    state.roulettePending += n;
    renderQueue();
    showRouletteWaiting();
    printSystemLine(`debug: queued ${n} roulette slot(s)`);
    if(!isProcessing) tick();
  } else if(cmd === "debug" && sub === "jackpot"){
    state.activeBuff = { remaining: 20, multiplier: 20 };
    saveState();
    injectBarrage(100);
    printSystemLine(`debug: forced ×20 JACKPOT barrage`);
  } else if(cmd === "debug" && sub === "bonus"){
    showBonusPopup();
  } else if(cmd === "debug" && sub === "anomaly"){
    triggerCriticalEvent(20000);
    printSystemLine(`debug: forced anomaly detected (20s)`);
  } else if(cmd === "reset" && sub === "confirm"){
    try{ localStorage.removeItem(STATE_KEY); } catch(e){}
    printSystemLine(`config reset — reloading…`);
    setTimeout(() => location.reload(), 400);
  } else if(cmd === "reset"){
    printSystemLine(`this clears all rev/upgrades/queues. type "reset confirm" to proceed`);
  } else {
    printSystemLine(`unrecognized directive "${cmd}" — check syntax`);
  }
}

function openCmdInput(){
  cmdInput.classList.add("active");
  cmdInput.focus();
}
function closeCmdInput(){
  cmdInput.classList.remove("active");
  cmdInput.value = "";
  cmdInput.blur();
}

// ウィンドウがアクティブな状態で"T"を押すとコマンド入力欄が現れる
document.addEventListener("keydown", (e) => {
  if(document.activeElement === cmdInput) return;
  if((e.key === "t" || e.key === "T") && !e.metaKey && !e.ctrlKey && !e.altKey){
    e.preventDefault();
    openCmdInput();
  }
});

cmdInput.addEventListener("keydown", (e) => {
  e.stopPropagation();
  if(e.key === "Enter"){
    handleCommand(cmdInput.value);
    closeCmdInput();
  } else if(e.key === "Escape"){
    closeCmdInput();
  }
});
cmdInput.addEventListener("blur", () => {
  closeCmdInput();
});
cmdInput.addEventListener("click", (e) => e.stopPropagation());

// ログの生成・抽選は「処理待ちキューが残っている間」だけ動く。
// キューが0になった時点でループは止まり、次にクリックでキューが積まれるまで完全アイドル
let isProcessing = false;

function goIdle(){
  isProcessing = false;
  statusText.textContent = "idle — waiting for jobs";
  durText.textContent = "";
}

function tick(){
  if(state.priorityPulls <= 0 && state.pendingPulls <= 0 && state.roulettePending <= 0){
    goIdle();
    return;
  }
  isProcessing = true;

  const elapsed = performance.now() - startTime;
  if(elapsed >= TOTAL_DURATION_MS){
    const div = document.createElement("div");
    div.className = "log-line ok";
    div.innerHTML = "✓ pipeline complete — all stages finished successfully";
    logEl.appendChild(div);
    bar.style.transition = "none";
    bar.style.width = "100%";
    pct.textContent = "100%";
    statusText.textContent = "完了";
    isProcessing = false;
    return;
  }

  // ラッシュが空になった時点で、ルーレット枠(roulettePending)を通常キューより優先して消化する。
  // ルーレット自体は別ウィンドウで独立して(1〜2分かけて)進行し、メインのtickループは止めない。
  // ただし既に別のルーレットが進行中(rouletteActive)なら、新規セッションは開始しない
  // (スタックされた分は現在進行中のセッション自身が1つずつ順番に消化する)
  if(state.priorityPulls <= 0 && state.roulettePending > 0 && !rouletteActive){
    const div = document.createElement("div");
    div.className = "log-line roulette-line";
    div.textContent = "◆ diagnostic roulette scheduled — opening secondary console";
    logEl.appendChild(div);

    state.roulettePending--;
    renderQueue();
    startRouletteSequence();

    statusText.textContent = "processing…";
    animateBar(PRIORITY_PULL_MS);
    setTimeout(tick, PRIORITY_PULL_MS);
    return;
  }

  // ルーレット進行中で、他に消化できるキューが何もなければ一旦アイドルに戻る
  // (ルーレットが決着すればapplyRouletteColor側がtick()を起こす)
  if(state.priorityPulls <= 0 && state.pendingPulls <= 0){
    goIdle();
    return;
  }

  appendLogLine();

  // 弾幕(無償の0.5秒ログ)が残っていれば、通常キューより優先して消化する
  if(state.priorityPulls > 0){
    // 在庫(消化前の残数)が500件以上残っている間はずっと高速消化のまま
    const rushDelay = state.priorityPulls >= RUSH_MILESTONE_STEP ? FAST_RUSH_MS : PRIORITY_PULL_MS;

    state.priorityPulls--;
    renderQueue();

    let rushReward = PRIORITY_PULL_REWARD;
    if(state.activeBuff && state.activeBuff.remaining > 0){
      rushReward *= state.activeBuff.multiplier;
      state.activeBuff.remaining--;
      if(state.activeBuff.remaining <= 0) state.activeBuff = null;
    }
    addCoins(rushReward);

    state.resolvedSincePopup++;
    if(state.resolvedSincePopup >= 10){
      state.resolvedSincePopup = 0;
      showBonusPopup();
    }

    saveState();

    statusText.textContent = rushDelay === FAST_RUSH_MS ? "processing… (rush ×fast)" : "processing… (rush)";
    animateBar(rushDelay);
    setTimeout(tick, rushDelay);
    return;
  }

  // このログ行の「処理時間」としてバーを0→100%までアニメーション
  const seconds = pickBucket();
  const duration = seconds * 1000;

  // tickが回ってきた = キューを1件消化するタイミング。ここで初めて抽選結果をコイン化する
  state.pendingPulls--;
  renderQueue();

  let reward = REWARD_TABLE[seconds] || 1;
  if(seconds === 20){
    reward *= state.rouletteN; // 異常検知の基礎報酬(5000)にもrouletteN倍を適用
  }
  if(state.activeBuff && state.activeBuff.remaining > 0){
    reward *= state.activeBuff.multiplier;
    state.activeBuff.remaining--;
    if(state.activeBuff.remaining <= 0) state.activeBuff = null;
  }
  addCoins(reward);

  state.resolvedSincePopup++;
  if(state.resolvedSincePopup >= 10){
    state.resolvedSincePopup = 0;
    showBonusPopup();
  }
  saveState();

  if(seconds === 20){
    triggerCriticalEvent(duration);
  } else {
    statusText.textContent = "processing…";
    animateBar(duration);
  }

  setTimeout(tick, duration);
}

// ---- 起動直後のバースト演出: 最初の約5秒でウィンドウの半分以上をログで埋める ----
const BURST_DURATION_MS = 5000;
const burstStart = performance.now();
statusText.textContent = "initializing…";

function burstTick(){
  const burstElapsed = performance.now() - burstStart;
  if(burstElapsed >= BURST_DURATION_MS){
    setTimeout(tick, 200);
    return;
  }
  appendLogLine();
  // バーも高速でチカチカ処理してる感を出す
  const fastDuration = randInt(80, 220);
  animateBar(fastDuration);
  statusText.textContent = "scanning…";

  setTimeout(burstTick, fastDuration);
}
setTimeout(burstTick, 150);
